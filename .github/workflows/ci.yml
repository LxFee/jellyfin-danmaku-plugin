name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - repository.json
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build plugin
        run: dotnet build plugin/Jellyfin.Plugin.Danmaku.csproj -c Release --nologo

      - name: Server compatibility checks
        run: dotnet run --project tests/Server -c Release

      - name: Package and repository manifest smoke test
        run: |
          python3 tools/package.py --output-dir /tmp/danmaku-package
          python3 tools/repository_manifest.py \
            --zip /tmp/danmaku-package/jellyfin-danmaku-*.zip \
            --source-url https://example.test/jellyfin-danmaku.zip \
            --output /tmp/repository.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install browser test dependency
        run: npm --prefix tests ci --no-audit --no-fund

      - name: Check Chrome
        run: |
          google-chrome --version || google-chrome-stable --version || {
            echo "tests/browser.cjs launches the 'chrome' channel and needs Google Chrome";
            exit 1
          }

      - name: Browser compatibility checks
        run: node tests/browser.cjs
